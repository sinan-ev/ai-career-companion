version: "3.9"

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: ai_career_backend
    ports:
      - "8000:8000"
    env_file:
      - ./Backend/.env
    volumes:
      - ./Backend:/app          # Hot-reloads code for Python development
      - backend_artifacts:/app/artifacts
      - backend_exports:/app/exports
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: builder          # Vite Dev server target
    container_name: ai_career_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app        # Hot-reloads frontend code
      - /app/node_modules      # Protect container node_modules from local overwrite
    environment:
      - VITE_API_URL=http://localhost:8000
    command: npm run dev -- --host 0.0.0.0

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: mlflow_server
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri /mlflow/tracking
        --default-artifact-root /mlflow/artifacts

volumes:
  backend_artifacts:
  backend_exports:
  mlflow_data:
